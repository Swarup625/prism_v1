# ==============================================================
# PRISM - ERROR DETECTION CONFIGURATION
# ==============================================================

experiment:
  name: "PRISM Error Detection"
  random_seed: 42

data:

  training_signals_path: "results/reliability_signals_oof.parquet"
  validation_signals_path: "results/reliability_signals.parquet"

  training_source: "out_of_fold_predictions"
  validation_source: "baseline_validation_predictions"

error_label:

  column: "error_label"

  definition:
    0: "Original baseline prediction is correct"
    1: "Original baseline prediction is incorrect"

features:

  - confidence
  - probability_margin
  - predictive_entropy

detector:

  model_type: "logistic_regression"
  model_path: "models/error_detector.joblib"

  purpose: >
    Estimate the probability that the original baseline prediction
    is incorrect.

threshold_selection:

  selection_data: "validation"

  criterion: "highest_f1_score"

  selected_threshold: 0.50

  optimized_threshold_experiment:
    threshold: 0.59
    f1_score: 0.4609

# The frozen PRISM verifier currently uses this risk threshold.
# No further tuning should be performed using the reserved test sets.

baseline_comparison:

  method: "confidence_based_error_detection"

  selected_confidence_threshold: 0.67

  validation_results:
    f1_score: 0.4626
    roc_auc: 0.7349

validation_results:

  default_detector:
    threshold: 0.50
    accuracy: 0.6132
    precision: 0.3011
    recall: 0.7480
    f1_score: 0.4294
    roc_auc: 0.7349

  optimized_detector:
    threshold: 0.59
    accuracy: 0.7160
    precision: 0.3653
    recall: 0.6240
    f1_score: 0.4609
    roc_auc: 0.7349

outputs:

  metrics_path: "results/detector_metrics.csv"

  validation_predictions_path: >
    results/detector_validation_predictions.parquet

  model_path: "models/error_detector.joblib"

reproducibility:

  oof_predictions_required: true
  test_sets_used_for_training: false
  test_sets_used_for_threshold_tuning: false